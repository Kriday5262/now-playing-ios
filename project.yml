name: NowPlaying
options:
  bundleIdPrefix: com.shantanu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NowPlaying:
    type: application
    platform: iOS
    sources:
      - path: NowPlaying
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shantanu.nowplaying
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"           # iPhone only
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    info:
      path: NowPlaying/Info.plist
      properties:
        CFBundleDisplayName: Now Playing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # local Navidrome servers are often plain http
        ITSAppUsesNonExemptEncryption: false